[package]
name = "ga4-omarchy"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "A fast, theme-aware Google Analytics 4 TUI for Omarchy"
license = "GPL-3.0-only"
repository = "https://github.com/gjlaubenstein/ga4-omarchy"
keywords = ["ga4", "analytics", "tui", "omarchy"]
categories = ["command-line-utilities"]

[[bin]]
name = "ga4"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"
crossterm = { version = "0.29", features = ["event-stream"] }
csv = "1.3"
directories = "6"
futures = "0.3"
hex = "0.4"
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }
open = "5"
ratatui = { version = "0.30", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
toml = "0.8"
yup-oauth2 = { version = "12", default-features = false, features = ["hyper-rustls", "ring"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
